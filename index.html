<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polypit</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 800px; height: 600px; transform-origin: 0 0; background: #000; }
  canvas { position: absolute; inset: 0; width: 800px; height: 600px; display: block; }
  #ui { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font: bold 18px "Courier New", Courier, monospace; color: #ddd; pointer-events: none; }
  .panel { pointer-events: auto; background: rgba(0,0,0,.92); border: 3px solid #bbb; box-shadow: 0 0 0 2px #444;
           padding: 16px 26px 18px; min-width: 340px; max-width: 700px; }
  .panel h2 { margin: 0 0 12px; text-align: center; letter-spacing: 4px; font-size: 22px; color: #fff; }
  .item { display: flex; justify-content: space-between; gap: 24px; padding: 4px 12px; cursor: pointer; color: #cfcfcf; }
  .item.sel { background: #1e8c3a; color: #fff; }
  .item .v { color: #ffd84a; }
  .item.sel .v { color: #fff; }
  .hint { margin-top: 12px; font-size: 13px; color: #888; text-align: center; font-weight: normal; }
  .logo { font-family: Impact, "Arial Black", sans-serif; text-align: center; line-height: .9; margin-bottom: 16px; }
  .logo .b { font-size: 92px; color: #0a9a3f; -webkit-text-stroke: 4px #fff; paint-order: stroke fill; letter-spacing: 4px; }
  .logo .o { font-size: 60px; color: #111; background: #fff; display: inline-block; padding: 0 14px; margin-top: 4px; letter-spacing: 6px; }
  .blink { animation: blink 1.1s steps(2) infinite; text-align: center; margin-top: 8px; }
  @keyframes blink { 50% { opacity: .2; } }
  table.hof { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  table.hof td { padding: 2px 8px; }
  table.hof td.r { text-align: right; color: #ffd84a; }
  table.hof tr.me td { background: #1e8c3a; color: #fff; }
  input.name { background: #000; color: #fff; border: 1px solid #fff; font: inherit; width: 12ch; padding: 0 4px; }
  .keys { border-collapse: collapse; font-weight: normal; font-size: 15px; }
  .keys td { padding: 2px 14px 2px 0; vertical-align: top; }
  .keys td:first-child { color: #ffd84a; white-space: nowrap; font-weight: bold; }
  .levels { display: flex; gap: 6px; justify-content: center; margin: 6px 0; }
  .levels .item { padding: 8px 12px; border: 1px solid #555; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="ui"></div>
</div>
<script src="core.js"></script>
<script src="ui.js"></script>
</body>
</html>
